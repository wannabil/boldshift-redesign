<!doctype html><html><head><style>
@font-face{font-family:C;font-weight:700;src:url(../../public/assets/fonts/caslon-bold.woff2)}
@font-face{font-family:C;font-style:italic;font-weight:400;src:url(../../public/assets/fonts/caslon-italic.woff2)}
@font-face{font-family:I;font-weight:300 700;src:url(../../public/assets/fonts/inter-var.woff2)}
html,body{margin:0}body{width:1200px;height:630px;background:#051c2c;position:relative;overflow:hidden;font-family:I;color:#fff}
.k{position:absolute;left:80px;top:70px;font:500 20px I;letter-spacing:.14em;text-transform:uppercase;color:#9fb3c4}
h1{position:absolute;left:80px;top:140px;margin:0;font:700 76px/1.04 C;letter-spacing:-.015em;width:1000px;white-space:nowrap}
h1 span{display:block}h1 span:nth-child(2){padding-left:60px;font-style:italic;font-weight:400}h1 span:nth-child(3){padding-left:100px}
.b{position:absolute;left:80px;bottom:60px;font:700 30px/0.95 C}.b span{display:block}.b span+span{padding-left:28px}
.u{position:absolute;right:80px;bottom:66px;font:400 22px I;color:#cfe0ee}
.bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,#051c2c,#0a2b78 45%,#2251ff)}
svg{position:absolute;right:-80px;top:-40px;width:620px;height:620px;opacity:.9}
</style></head><body>
<svg viewBox="0 0 600 600" id="a"></svg>
<div class="k">Bold Shift Advisory · By Ferhan Johar</div>
<h1><span>Build capability.</span><span>Earn trust.</span><span>Make your work count.</span></h1>
<div class="b"><span>Bold Shift</span><span>Advisory</span></div><div class="u">Interview prep · Corporate training · Malaysia</div><div class="bar"></div>
<script>
const s=document.getElementById('a');let h='<defs><linearGradient id="g"><stop offset="0" stop-color="#00a9f4"/><stop offset="1" stop-color="#2251ff"/></linearGradient></defs>';
for(let i=1;i<16;i++){const r=i*20;h+=`<circle cx="380" cy="300" r="${r}" fill="none" stroke="url(#g)" stroke-opacity="${(0.85-i/20).toFixed(2)}" stroke-width="1.4" stroke-dasharray="${r*2} ${r}" transform="rotate(${i*37} 380 300)"/>`}
s.innerHTML=h+'<circle cx="380" cy="300" r="7" fill="#00a9f4"/>';
</script></body></html>
